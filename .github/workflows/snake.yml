name: Atualizar cobrinha de contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Gerar animação
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Gerar SVG para os modos claro e escuro
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E94D5F&color_dots=#ebedf0,#f4b6c2,#e879a0,#b85fd6,#7F52FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#30A3DC&color_dots=#161b22,#0e7490,#2563eb,#7c3aed,#E94D5F

      - name: Publicar SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
